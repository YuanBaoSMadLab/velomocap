[package]
name = "velomocap-infer"
description = "ONNX Runtime inference layer for VeloMocap (CUDA + CPU execution providers)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velomocap-core = { path = "../velomocap-core" }
velomocap-video = { path = "../velomocap-video" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ort = { version = "2.0.0-rc.15", features = ["load-dynamic", "ndarray", "cuda"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
